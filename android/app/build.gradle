plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.go.edu.edupass'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.go.edu.edupass'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions += 'connection'
    productFlavors {
        local {
            dimension 'connection'
            applicationIdSuffix '.local'
            buildConfigField 'boolean', 'ALLOW_PRIVATE_HTTP', 'true'
            resValue 'string', 'app_name', '교육 출석부 로컬'
        }
        remote {
            dimension 'connection'
            applicationIdSuffix '.remote'
            buildConfigField 'boolean', 'ALLOW_PRIVATE_HTTP', 'false'
            resValue 'string', 'app_name', '교육 출석부 원격'
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
