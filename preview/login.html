<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 미리보기</title>
  <link rel="stylesheet" href="../frontend/shared/assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../frontend/shared/assets/css/krds-theme.css">
  <link rel="stylesheet" href="../frontend/shared/assets/css/app.css">
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body class="sign-body">
  <a class="krds-skip-link" href="#mainContent">본문으로 바로가기</a>
  <header class="service-header">
    <div class="service-inner service-masthead">
      <div class="service-brand">
        <img src="../frontend/shared/assets/icons/service-mark.svg" width="44" height="44" alt="">
        <div><strong>방문 기록 시스템</strong><small>관리자 업무 화면</small></div>
      </div>
    </div>
  </header>

  <main class="login-shell" id="mainContent" tabindex="-1">
    <div class="preview-banner">화면 미리보기 · 로그인 정보는 전송되지 않습니다. <a href="admin.html">관리자 화면 보기 →</a></div>
    <nav class="krds-breadcrumb" aria-label="현재 위치">
      <span>방문 기록</span><span aria-hidden="true">›</span>
      <span aria-current="page">관리자 로그인</span>
    </nav>
    <section class="card sign-card">
      <h1>관리자 로그인</h1>
      <p class="muted">등록된 관리자 또는 운영자 계정으로 로그인하세요.</p>
      <div class="login-form">
        <label>계정명<input placeholder="계정명 예시" readonly class="form-control"></label>
        <label>비밀번호<input type="password" placeholder="비밀번호 예시" readonly class="form-control"></label>
        <button class="btn btn-primary primary-btn wide demo-button" type="button">로그인</button>
      </div>
    </section>
  </main>
</body>
</html>
