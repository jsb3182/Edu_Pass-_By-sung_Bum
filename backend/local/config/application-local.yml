spring:
  config:
    import: classpath:local-db.yml
app:
  mode: local
  node-id: ${APP_NODE_ID:office-local-01}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}
  allow-insecure-http: ${APP_ALLOW_INSECURE_HTTP:false}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
