<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인</title>
  <link rel="stylesheet" href="/shared/assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/shared/assets/css/krds-theme.css">
  <link rel="stylesheet" href="/shared/assets/css/app.css">
  <script src="/master/js/login.js" defer></script>
</head>
<body class="sign-body">
  <a class="krds-skip-link" href="#mainContent">본문으로 바로가기</a>
  <header class="service-header">
    <div class="service-inner service-masthead">
      <div class="service-brand">
        <img src="/shared/assets/icons/service-mark.svg" width="44" height="44" alt="">
        <div><strong>방문 기록 시스템</strong><small>관리자 업무 화면</small></div>
      </div>
    </div>
  </header>

  <main class="login-shell" id="mainContent" tabindex="-1">
    <nav class="krds-breadcrumb" aria-label="현재 위치">
      <span>방문 기록</span><span aria-hidden="true">›</span>
      <span aria-current="page">관리자 로그인</span>
    </nav>

    <section class="card sign-card">
      <h1>관리자 로그인</h1>
      <p class="muted">등록된 관리자 또는 운영자 계정으로 로그인하세요.</p>
      <p class="krds-field-hint"><span class="krds-required">*</span> 표시는 필수 입력 항목입니다.</p>
      <div id="loginMessage" class="alert message error" role="alert" hidden></div>
      <form class="login-form" action="/login" method="post">
        <input id="loginCsrf" type="hidden" name="_csrf">
        <label><span>계정명 <span class="krds-required" aria-hidden="true">*</span></span>
          <input name="username" autocomplete="username" required class="form-control">
        </label>
        <label><span>비밀번호 <span class="krds-required" aria-hidden="true">*</span></span>
          <input name="password" type="password" autocomplete="current-password" required class="form-control">
        </label>
        <button id="loginButton" class="btn btn-primary primary-btn wide" type="submit" disabled>로그인 준비 중…</button>
      </form>
    </section>
  </main>
</body>
</html>
